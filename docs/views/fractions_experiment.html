<!DOCTYPE html>
<html>
<head>
  <title>Fractions Experiment</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.1/jquery.min.js"></script>

  <script src="https://unpkg.com/jspsych@7.3.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-instructions@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-html-form"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.2"></script>
  <link href="https://unpkg.com/jspsych@7.3.2/css/jspsych.css" rel="stylesheet" />
  <link href="../css/experiment.css" rel="stylesheet" />
  <link href="../css/chat.css" rel="stylesheet" />

  <!-- MathJax for rendering LaTeX math notation -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]']],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre']
      }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>

  <script src="./firebaseconfig.js"></script>
  <script src="../js/chat.js"></script>

  <style>
    .puzzle-container { display:flex; flex-direction:column; align-items:center; gap:20px; margin:20px auto; max-width:800px; padding:20px; box-sizing:border-box; }
    .puzzle-problem { font-size:24px; line-height:2; text-align:center; max-width:600px; padding:30px; background:#f9f9f9; border-radius:8px; border:1px solid #ddd; }
    .answer-section { display:inline-flex; align-items:center; gap:10px; }
    .answer-input { width:120px; height:40px; font-size:20px; text-align:center; border:2px solid #333; border-radius:4px; }
    .answer-input:focus { outline:none; border-color:#2E86AB; background:#e8f4f8; }
    .answer-input.correct { background:#d4f4dd; border-color:#28a745; }
    .answer-input.incorrect { background:#ffd6d6; border-color:#dc3545; }
    .answer-input:disabled { opacity:0.7; cursor:not-allowed; }
    .answer-units { font-size:18px; color:#333; }
    .feedback-area { text-align:center; margin:20px 0; font-size:16px; min-height:30px; }
    .chat-widget,.chat-container { display:block !important; }

    /* Center instruction pages vertically */
    .jspsych-instructions-nav {
      position: fixed !important;
      bottom: 20px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: auto !important;
      text-align: center !important;
    }

    /* Default centering for instruction/consent/survey-likert pages */
    .jspsych-content-wrapper {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      min-height: 100vh !important;
      padding: 20px !important;
      box-sizing: border-box !important;
    }

    .jspsych-content {
      max-width: 1000px !important;
      margin: 0 auto !important;
    }

    /* Reduce Likert scale width */
    .jspsych-survey-likert-opts {
      max-width: 600px !important;
      margin: 0 auto !important;
    }

    /* Larger font and radio buttons for Likert surveys */
    .jspsych-survey-likert-statement {
      font-size: 20px !important;
      margin-bottom: 10px !important;
    }

    .jspsych-survey-likert-opts li label {
      font-size: 14px !important;
    }

    .jspsych-survey-likert-opts li input[type="radio"] {
      width: 18px !important;
      height: 18px !important;
    }

    .jspsych-survey-likert-preamble {
      font-size: 20px !important;
    }

    /* Custom likert scale with grey line matching jsPsych */
    .custom-likert-scale {
      max-width: 500px;
      margin: 0 auto;
    }

    .custom-likert-opts {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      justify-content: space-between;
      position: relative;
      padding-top: 20px;
    }

    .custom-likert-opts:before {
      content: '';
      position: absolute;
      top: 24px;
      left: 0;
      right: 0;
      background-color: #efefef;
      height: 4px;
      width: 100%;
      z-index: 0;
    }

    .custom-likert-opts li {
      display: inline-block;
      text-align: center;
      vertical-align: top;
      position: relative;
      flex: 1;
      z-index: 1;
    }

    .custom-likert-opts li input[type="radio"] {
      display: block;
      margin: 0 auto 8px auto;
      position: relative;
      z-index: 2;
    }

    .custom-likert-opts li label {
      display: block;
      text-align: center;
      font-size: 10pt;
      line-height: 1.1em;
    }

    .custom-likert-question {
      font-size: 18px;
      margin: 0 0 1em 0;
      font-weight: normal;
    }

    .answer-hint {
      font-size: 14px;
      color: #666;
      margin-top: 5px;
    }

    /* Larger font for ChatGPT messages */
    .assistant-message {
      font-size: 18px !important;
    }

    /* Hints panel styles for control condition */
    .hints-sidebar {
      width: 40vw;
      max-width: 700px;
      min-width: 260px;
      position: fixed;
      right: 0;
      top: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      height: 100vh;
      background: #f9f9f9;
      border-left: 1px solid #ddd;
      box-shadow: -2px 0 10px rgba(0,0,0,0.1);
    }
    .hints-sidebar.hidden {
      display: none !important;
    }
    .hints-resize-handle {
      position: absolute;
      left: 0;
      top: 0;
      width: 8px;
      height: 100%;
      cursor: ew-resize;
      background: transparent;
      z-index: 101;
    }
    .hints-resize-handle:hover {
      background: rgba(46, 134, 171, 0.3);
    }
    .hints-header {
      background: #2E86AB;
      color: white;
      padding: 16px;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
    }
    .hints-content {
      padding: 20px;
      flex: 1;
      overflow-y: auto;
      font-size: 16px;
      line-height: 1.6;
    }
    .hints-content h3 {
      margin-top: 0;
      color: #333;
      font-size: 18px;
    }
    .hints-content p {
      margin: 12px 0;
      color: #444;
    }
    .hints-content .hint-box {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
    }
    .hints-content .hint-box h4 {
      margin: 0 0 10px 0;
      color: #2E86AB;
      font-size: 16px;
    }

    /* Progress bar styles */
    .progress-container {
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      text-align: center;
    }
    .progress-bar-wrapper {
      width: 600px;
      max-width: 100%;
      height: 20px;
      background-color: #e0e0e0;
      border-radius: 10px;
      overflow: hidden;
      margin: 0 auto 8px auto;
    }
    .progress-bar-fill {
      height: 100%;
      background-color: #4CAF50;
      border-radius: 10px;
      transition: width 0.3s ease;
    }
    .progress-text {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div id="jspsych_target"></div>

  <!-- Notice shown on problems (and the final test) where the AI assistant is not available -->
  <div class="chat-sidebar hidden" id="hintsSidebar">
    <div class="chat-resize-handle" id="hintsResizeHandle"></div>
    <div class="chat-widget">
      <div class="chat-container open">
        <div class="chat-header" style="font-weight: normal; font-family: Roboto, sans-serif;">
          ChatGPT
        </div>
        <div class="chat-messages">
          <div class="message assistant-message">
            The AI assistant is not available for this problem.
          </div>
        </div>
        <div class="chat-input-container">
          <input type="text" class="chat-input" placeholder="Ask anything" disabled />
          <button class="chat-send" aria-label="Send" title="Send" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
              <path d="M12 3l4.5 4.5-1.4 1.4L13 6.8V20h-2V6.8L8.9 8.9 7.5 7.5 12 3z" fill="currentColor"/>
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
<script type="module">
  import { writeRealtimeDatabase, writeURLParameters, blockRandomization,
           finalizeBlockRandomization, firebaseUserId } from "./firebasepsych1.0.js";

  /* ---------- FIREBASE: STUDY ID, RANDOMIZATION, PARTICIPANT INFO ---------- */
  window.experimentName = "fractions";
  // Cloud Function URL (GitHub Pages cannot proxy /chat). Replace YOUR_PROJECT_ID.
  window.CHAT_URL = "https://us-central1-aiassist-exp.cloudfunctions.net/chat";             // read by chat.js, sent to the /chat function
  const urlParams = new URLSearchParams(window.location.search);
  let studyId = "aiAssistFractions";
  if (urlParams.get("notProlific")) { studyId = "tests"; }
  const maxCompletionTimeMinutes = 30;           // slot is released if a participant does not finish in this time
  const CONDITION_NAME = "AI_CONTROL_INTERLEAVED_BLOCK";
  const BLOCKPOS_NAME = "AI_BLOCK_POSITION";     // second randomization: block participants get AI first or last

  // Conditions: 0 = AI on all 21 training problems, 1 = AI off on all 21,
  //             2 = interleaved: AI on/off in alternating triplets (on, off, on, off, on, off, on),
  //             3 = block: AI on for 12 problems in a row, at the START or the END of training (randomized), AI off for the other 9
  const COND_NAMES = ["AI", "control", "AI_interleaved", "AI_block"];
  const N_TRIPLETS = 7;            // training = 7 triplets of (easy, medium, hard) = 21 problems
  const BLOCK_AI_TRIPLETS = 4;     // 4 triplets x 3 = 12 AI problems in the block condition
  // On every AI-off training problem and on the 3 final test problems, the right side of the screen says the AI assistant is not available.

  // TEST LINK: ?condition=ai | control | interleaved | block_start | block_end   (block = block_start)
  // A forced condition always writes to the "tests" study and skips block randomization, so it never touches real data or counts.
  const forcedName = (urlParams.get("condition") || "").toLowerCase();
  const FORCE_MAP = { ai: 0, control: 1, interleaved: 2, block: 3, block_start: 3, block_end: 3 };
  const forced = Object.prototype.hasOwnProperty.call(FORCE_MAP, forcedName);
  if (forced) { studyId = "tests"; }
  const assignedCondition = forced
    ? FORCE_MAP[forcedName]
    : (await blockRandomization(studyId, CONDITION_NAME, 4, maxCompletionTimeMinutes, 1))[0];
  // For the block condition: 0 = AI block at the start, 1 = AI block at the end
  let blockPosition = null;
  if (assignedCondition === 3) {
    const _pos = forced
      ? (forcedName === "block_end" ? 1 : 0)
      : (await blockRandomization(studyId, BLOCKPOS_NAME, 2, maxCompletionTimeMinutes, 1))[0];
    blockPosition = (_pos === 1) ? "end" : "start";
  }
  const CONDITION_LABEL = COND_NAMES[assignedCondition];   // block start/end is stored separately as blockPosition
  const basePath = studyId + "/participantData/" + firebaseUserId;
  // Bump this string whenever the participant-facing procedure changes, so each record says which version it saw.
  // Records written before this tag existed have no experimentVersion (the parser labels them "v1_condition_specific_instructions").
  const EXPERIMENT_VERSION = "v2_shared_ai_instructions_2026-11-18";
  writeRealtimeDatabase(basePath + "/experimentVersion", EXPERIMENT_VERSION);
  writeRealtimeDatabase(basePath + "/assignedCondition", CONDITION_LABEL);
  if (blockPosition) { writeRealtimeDatabase(basePath + "/blockPosition", blockPosition); }
  if (forced) { writeRealtimeDatabase(basePath + "/forcedCondition", true); }
  writeURLParameters(basePath + "/participantInfo");   // Prolific PID, study id, session id
  let trialCounter = 0;
  const SURVEY_TYPES = ["post_survey", "ai_usage_survey", "bot_check", "feedback"];

  // The module script can run after DOMContentLoaded, so run immediately if the DOM is already ready.
  function onReady(fn) {
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", fn);
    else fn();
  }
  var allPuzzleChatLogs = {}; // Store chat logs for each puzzle by puzzle identifier
  var currentPuzzleId = null; // Track which puzzle is currently active
  var puzzleStartTime, puzzleCompletionTime, userSolved;
  // New tracking variables per requirements
  var puzzleGaveUp = false;              // whether user clicked Give Up (and had not already solved correctly)
  var puzzleSolvedCorrectly = false;     // whether the answer is correct

  // Function to log chat messages for the current puzzle
  window.logChatMessage = function(messageObj) {
    if (currentPuzzleId !== null) {
      if (!allPuzzleChatLogs[currentPuzzleId]) {
        allPuzzleChatLogs[currentPuzzleId] = [];
      }
      allPuzzleChatLogs[currentPuzzleId].push(messageObj);
      const _idx = String(allPuzzleChatLogs[currentPuzzleId].length - 1).padStart(3, '0');
      writeRealtimeDatabase(basePath + '/chat/' + currentPuzzleId + '/' + _idx, messageObj);
    }
  };


  /* ---------- WINDOW / TAB LEAVING ----------
     "Away" = tab hidden OR window lost focus (switching tabs, other app, clicking the URL bar).
     Each leave and return is written to <base>/focusEvents/<NNNN>, and per-problem totals go in the trial record. */
  var awayStats = {};          // puzzleId -> { count, ms }
  var awaySince = null;        // timestamp when the current absence began
  var awayPuzzleId = null;     // puzzle that was active when it began
  var focusEventCount = 0;
  function awayKey(){ return currentPuzzleId === null ? "between_trials" : currentPuzzleId; }
  function logFocusEvent(type, extra){
    const _i = String(focusEventCount++).padStart(4, "0");
    writeRealtimeDatabase(basePath + "/focusEvents/" + _i, Object.assign({
      type: type, puzzle_id: awayKey(), timestamp: new Date().toISOString()
    }, extra || {}));
  }
  function userLeft(reason){
    if (awaySince !== null) return;               // already away
    awaySince = Date.now();
    awayPuzzleId = awayKey();
    if (!awayStats[awayPuzzleId]) awayStats[awayPuzzleId] = { count: 0, ms: 0 };
    awayStats[awayPuzzleId].count += 1;
    logFocusEvent("leave", { reason: reason });
  }
  function userReturned(){
    if (awaySince === null) return;
    const ms = Date.now() - awaySince;
    awayStats[awayPuzzleId].ms += ms;
    logFocusEvent("return", { away_ms: ms, left_during: awayPuzzleId });
    awaySince = null; awayPuzzleId = null;
  }
  function awayFor(id){                            // totals for one puzzle, including an absence still in progress
    const s = awayStats[id] || { count: 0, ms: 0 };
    const ongoing = (awaySince !== null && awayPuzzleId === id) ? (Date.now() - awaySince) : 0;
    return { count: s.count, ms: s.ms + ongoing };
  }
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) userLeft("hidden"); else if (document.hasFocus()) userReturned();
  });
  window.addEventListener("blur", function(){ userLeft("blur"); });
  window.addEventListener("focus", function(){ if (!document.hidden) userReturned(); });

  /* ---------- FULL SCREEN (adapted from the Sokoban experiment) ----------
     Entered when the participant accepts the consent form (a click, which browsers require). Keyboard Lock stops a normal
     Esc press from leaving full screen (Chrome/Edge, needs https; holding Esc still exits). If full screen is left anyway,
     it is re-entered on the next click or key press and a banner asks the participant to go back. Every request, enter and
     exit is written to focusEvents, and each trial records fullscreen_exits.
     Add ?fullscreen=0 to a test link to turn all of this off. */
  const FULLSCREEN_ON = (urlParams.get("fullscreen") !== "0") &&
    !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
  var FS = { wanted: false, pending: false, finished: false };
  var fsExits = {};            // puzzleId -> number of times full screen was left
  var fsOutMs = {};            // puzzleId -> total ms spent out of full screen (counted from the exit to the next re-entry)
  var fsOutSince = null, fsOutPuzzle = null;
  function fsOutFor(id){ return (fsOutMs[id] || 0) + ((fsOutSince !== null && fsOutPuzzle === id) ? (Date.now() - fsOutSince) : 0); }
  function fsElement(){ return document.fullscreenElement || document.webkitFullscreenElement || null; }
  const fsBanner = document.createElement("div");
  fsBanner.textContent = "This study runs in full screen. Click anywhere or press any key to return to full screen.";
  fsBanner.style.cssText = "display:none;position:fixed;top:0;left:0;right:0;z-index:2147483647;background:#b71c1c;color:#fff;" +
    "text-align:center;padding:10px 16px;font:600 16px 'Open Sans',Arial,sans-serif;pointer-events:none;";
  document.body.appendChild(fsBanner);
  function setFsBanner(on){ fsBanner.style.display = on ? "block" : "none"; }
  async function lockEscape(){
    if (!navigator.keyboard || typeof navigator.keyboard.lock !== "function") return "unsupported";
    try { await navigator.keyboard.lock(["Escape"]); return "locked"; }
    catch (err) { return "failed: " + String((err && err.message) || err); }
  }
  async function requestFS(via){
    if (!FULLSCREEN_ON || FS.finished || FS.pending || fsElement()) return;
    FS.pending = true;
    const el = document.documentElement;
    let info;
    try {
      const p = el.requestFullscreen ? el.requestFullscreen({ navigationUI: "hide" }) : el.webkitRequestFullscreen();
      if (p && p.then) await p;
      info = { outcome: "entered", via: via };
    } catch (err) {
      info = { outcome: "failed", via: via, error: String((err && err.message) || err) };
    }
    FS.pending = false;
    if (info.outcome === "entered") info.keyboard_lock = await lockEscape();
    logFocusEvent("fullscreen_request", info);
  }
  function ensureFS(via){ if (FS.wanted && !FS.finished && !FS.pending && !fsElement()) requestFS(via); }
  function onFsChange(){
    if (fsElement()) {
      FS.wanted = true; setFsBanner(false);
      let outMs = null;
      if (fsOutSince !== null) { outMs = Date.now() - fsOutSince; fsOutMs[fsOutPuzzle] = (fsOutMs[fsOutPuzzle] || 0) + outMs; fsOutSince = null; fsOutPuzzle = null; }
      logFocusEvent("fullscreen_enter", outMs === null ? { via: "change" } : { via: "change", out_of_fullscreen_ms: outMs });
    } else if (FS.wanted && !FS.finished) {
      fsExits[awayKey()] = (fsExits[awayKey()] || 0) + 1;
      if (fsOutSince === null) { fsOutSince = Date.now(); fsOutPuzzle = awayKey(); }
      setFsBanner(true);
      logFocusEvent("fullscreen_exit", { via: "change" });
    }
  }
  document.addEventListener("fullscreenchange", onFsChange);
  document.addEventListener("webkitfullscreenchange", onFsChange);
  document.addEventListener("click", function(){ ensureFS("click_reenter"); }, true);
  document.addEventListener("keydown", function(e){ if (e.key !== "Escape") ensureFS("key_reenter"); }, true);   // Esc itself is not a user gesture
  function startFullscreen(via){ if (!FULLSCREEN_ON) return; FS.wanted = true; requestFS(via); }
  function stopFullscreen(){
    FS.finished = true; setFsBanner(false);
    try { if (navigator.keyboard && navigator.keyboard.unlock) navigator.keyboard.unlock(); } catch (e) {}
    try { if (fsElement()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {}
  }

  var jsPsych = initJsPsych({
    display_element: $('#jspsych_target')[0],
    // survey responses are written as soon as each survey trial ends
    on_data_update: function(data){
      if (SURVEY_TYPES.includes(data.stimulus_type)) {
        writeRealtimeDatabase(basePath + "/surveys/" + data.stimulus_type, {
          response: data.response, rt: data.rt, timestamp: new Date().toISOString()
        });
      }
    },
    on_finish: function(){
      if (consentDeclined) {
        // Declined consent: no completion code, no finish page, and this person must not count as a completed participant
        // (their condition slot is not finalized, so it is released after the timeout). Close the window if the browser allows it.
        writeRealtimeDatabase(basePath + "/consent", "declined");
        stopFullscreen();
        setTimeout(function(){ try { window.close(); } catch (e) {} }, 2500);
        return;
      }
      stopFullscreen();   // study is over: release Esc and leave full screen
      userReturned();   // close any absence still open
      let _tc = 0, _tm = 0, _fx = 0, _fo = 0;
      Object.keys(awayStats).forEach(k => { _tc += awayStats[k].count; _tm += awayStats[k].ms; });
      Object.keys(fsExits).forEach(k => { _fx += fsExits[k]; });
      Object.keys(fsOutMs).forEach(k => { _fo += fsOutMs[k]; });
      if (fsOutSince !== null) { _fo += Date.now() - fsOutSince; }
      const writes = Promise.all([
        writeRealtimeDatabase(basePath + "/windowLeaveSummary", { total_leaves: _tc, total_away_ms: _tm, total_fullscreen_exits: _fx, total_fullscreen_out_ms: _fo }),
        writeRealtimeDatabase(basePath + "/completedAt", new Date().toISOString()),
        forced ? Promise.resolve() : finalizeBlockRandomization(studyId, CONDITION_NAME),
        (forced || !blockPosition) ? Promise.resolve() : finalizeBlockRandomization(studyId, BLOCKPOS_NAME)
      ]);
      // give the writes a moment to land, but never block the redirect for long
      Promise.race([writes, new Promise(r => setTimeout(r, 3000))])
        .finally(() => { window.location.href = "../finish_fractions.html"; });
    }
  });

  // Condition comes from blockRandomization (above): 1 = control / no AI
  const participantNoAI = (assignedCondition === 1);
  const participantInterleaved = (assignedCondition === 2);
  const participantBlock = (assignedCondition === 3);
  // Is the AI available on training problem number `index` (0-based, 21 problems = 7 triplets of 3)?
  //   AI: always. Control: never.
  //   Interleaved: triplets 1,3,5,7 on; 2,4,6 off.
  //   Block: first 4 triplets on (start) or last 4 triplets on (end); the AI triplets are 1-4 or 4-7.
  function aiAvailableOnTraining(index) {
    const t = Math.floor(index / 3);
    if (participantNoAI) return false;
    if (participantInterleaved) return t % 2 === 0;
    if (participantBlock) return blockPosition === "start" ? (t < BLOCK_AI_TRIPLETS) : (t >= N_TRIPLETS - BLOCK_AI_TRIPLETS);
    return true;
  }
  var currentAIAvailable = false;      // set in setupPuzzle, logged with each trial
  var currentNoticeShown = false;      // "AI not available" notice on screen, logged with each trial
  // Attach condition to all jsPsych data
  jsPsych.data.addProperties({ experiment_version: EXPERIMENT_VERSION, no_ai_condition: participantNoAI, condition_name: CONDITION_LABEL, block_position: blockPosition });

        submitter.disabled = false;
      }
      if (typeof form.requestSubmit === 'function') {
        form.requestSubmit();
        return;
      }
    }
    // Fallback: click the hidden submit directly
    const submit = document.querySelector('button[type="submit"], input[type="submit"]');
    if (submit) { submit.disabled = false; submit.click(); }
  }

  function convertGiveUpToContinue(){
    const oldBtn = document.getElementById('give-up-button') || document.getElementById('submit-button');
    if(!oldBtn) return;
    const newBtn = oldBtn.cloneNode(true);
    newBtn.id = 'continue-button';
    newBtn.textContent = 'Continue';
    newBtn.disabled = false;
    // Remove any previous listeners by replacing node and attach proceed handler
    oldBtn.parentNode.replaceChild(newBtn, oldBtn);
    newBtn.addEventListener('click', ()=>{ proceedToNextTrial(); });
  }

  function convertGiveUpToSubmit(){
    const oldBtn = document.getElementById('give-up-button');
    if(!oldBtn) return;
    const newBtn = oldBtn.cloneNode(true);
    newBtn.id = 'submit-button';
    newBtn.textContent = 'Submit';
    newBtn.disabled = false;
    // Remove any previous listeners by replacing node and attach submit handler
    oldBtn.parentNode.replaceChild(newBtn, oldBtn);
    newBtn.addEventListener('click', ()=>{ submitPuzzle(currentPuzzle); });
  }

  // Functions to show/hide hints panel for control condition
  var hintsResizeInitialized = false;

  function updateHintsLayoutMargin(widthPx) {
    if (window.innerWidth <= 768) {
      document.body.style.marginRight = '';
      return;
    }
    const defaultWidth = Math.round(window.innerWidth * 0.4);
    document.body.style.marginRight = (widthPx || defaultWidth) + 'px';
  }

  function initHintsResize() {
    if (hintsResizeInitialized) return;
    hintsResizeInitialized = true;

    const sidebar = document.getElementById('hintsSidebar');
    const handle = document.getElementById('hintsResizeHandle');
    if (!sidebar || !handle) return;

    let isResizing = false;
    let startX = 0;
    let startWidth = 0;

    const onMouseMove = (e) => {
      if (!isResizing || !sidebar) return;
      const dx = startX - e.clientX;
      let newWidth = startWidth + dx;
      const minWidth = 260;
      const maxWidth = 700;
      if (newWidth < minWidth) newWidth = minWidth;
      if (newWidth > maxWidth) newWidth = maxWidth;
      sidebar.style.width = newWidth + 'px';
      updateHintsLayoutMargin(newWidth);
    };

    const onMouseUp = () => {
      if (!isResizing) return;
      isResizing = false;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
      const currentWidth = sidebar ? parseInt(getComputedStyle(sidebar).width, 10) : null;
      if (currentWidth) {
        try { localStorage.setItem('chatSidebarWidth', String(currentWidth)); } catch (_) {}
      }
    };

    handle.addEventListener('mousedown', (e) => {
      if (!sidebar) return;
      isResizing = true;
      startX = e.clientX;
      startWidth = parseInt(getComputedStyle(sidebar).width, 10);
      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
      e.preventDefault();
    });

    // Handle window resize
    window.addEventListener('resize', () => {
      if (!sidebar.classList.contains('hidden')) {
        const width = parseInt(getComputedStyle(sidebar).width, 10);
        updateHintsLayoutMargin(width);
      }
    });
  }

  function showHintsPanel() {
    const hintsSidebar = document.getElementById('hintsSidebar');
    if (hintsSidebar) {
      // Restore saved width if available
      const savedWidth = parseInt(localStorage.getItem('chatSidebarWidth'), 10);
      if (!isNaN(savedWidth) && savedWidth > 0) {
        hintsSidebar.style.width = savedWidth + 'px';
      }
      hintsSidebar.classList.remove('hidden');
      document.body.classList.add('split-screen-layout');
      // Set margin to match hints panel width
      const width = parseInt(getComputedStyle(hintsSidebar).width, 10) || 300;
      updateHintsLayoutMargin(width);
      // Initialize resize handler
      initHintsResize();
      // Render MathJax in hints panel
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([hintsSidebar]).catch((err) => console.log('MathJax typeset error:', err));
      }
    }
  }

  function hideHintsPanel() {
    const hintsSidebar = document.getElementById('hintsSidebar');
    if (hintsSidebar) {
      hintsSidebar.classList.add('hidden');
    }
    // Only remove split-screen layout if chat is also hidden
    if (!window.chatWidget || document.getElementById('chatSidebar')?.classList.contains('hidden')) {
      document.body.classList.remove('split-screen-layout');
      document.body.style.marginRight = '';
    }
  }

  // showSidebar: true for training and final problems (chat or the "not available" notice), false for the pretest.
  // aiOn (training only): whether the AI chat is available on this problem. Defaults to true for non-control participants.
  function setupPuzzle(p, showSidebar, aiOn){
    puzzleStartTime = Date.now();
    userSolved = false;
    puzzleGaveUp = false;
    puzzleSolvedCorrectly = false;
    puzzleCompletionTime = null;
    currentPuzzle = p;

    // Set current puzzle ID for chat logging
    currentPuzzleId = p.id;
    const aiHere = !participantNoAI && !!showSidebar && (aiOn === undefined ? true : !!aiOn);
    const noticeHere = !!showSidebar && !aiHere;      // AI-off training problems and the final test (not the pretest)
    currentAIAvailable = aiHere;
    currentNoticeShown = noticeHere;

    // Typeset MathJax content
    if (window.MathJax && window.MathJax.typesetPromise) {
      window.MathJax.typesetPromise().catch((err) => console.log('MathJax typeset error:', err));
    }

    // Conditionally show/hide sidebar (chat for AI condition, hints for control condition)
    setTimeout(()=>{
      // AI chat where the AI is available, the "not available" notice where it is not, nothing on the pretest
      if (aiHere) {
        hideHintsPanel();
        if(window.chatWidget) { window.chatWidget.showChat(); }
      } else {
        if(window.chatWidget) { window.chatWidget.hideChat(); }
        if (noticeHere) { showHintsPanel(); } else { hideHintsPanel(); }
      }
    },100);

    // Hide Continue/submit until Give Up or correct answer
    hideNativeContinue();
    setTimeout(hideNativeContinue, 0);

    // Answer input events
    const answerInput = document.getElementById('answer-input');
    if(answerInput){
      answerInput.addEventListener('input', (e) => {
        answerInput.classList.remove('correct','incorrect');
        // Check if answer is filled to enable submit button
        if(answerInput.value.trim() !== ''){
          // Convert Give Up to Submit if not already done
          if(!document.getElementById('submit-button')){
            convertGiveUpToSubmit();
          }
        }
      });

      answerInput.addEventListener('keydown', (e) => {
        if(e.key === 'Enter') {
          e.preventDefault();
          if(answerInput.value.trim() !== ''){
            submitPuzzle(currentPuzzle);
          }
        }
      });
    }

    // Give Up button handler
    let giveUpBtn = document.getElementById('give-up-button');
    if(giveUpBtn){
      giveUpBtn.addEventListener('click', ()=>{ onGiveUp(p); });
    }
  }

  function parseFraction(str) {
    // Parse into an exact {num, den} pair of BigInts (den > 0), or null if not a valid fraction.
    // Remove whitespace
    str = str.trim();

    // Check for mixed number format like "2 1/2" or "2 3/4"
    const mixedMatch = str.match(/^(-?)(\d+)\s+(\d+)\/(\d+)$/);
    if (mixedMatch) {
      const sign = mixedMatch[1] === '-' ? -1n : 1n;
      const whole = BigInt(mixedMatch[2]);
      const num = BigInt(mixedMatch[3]);
      const denom = BigInt(mixedMatch[4]);
      if (denom === 0n) return null;
      return { num: sign * (whole * denom + num), den: denom };
    }

    // Check for simple fraction format like "3/4"
    const fractionMatch = str.match(/^(-?\d+)\/(\d+)$/);
    if (fractionMatch) {
      const num = BigInt(fractionMatch[1]);
      const denom = BigInt(fractionMatch[2]);
      if (denom === 0n) return null;
      return { num: num, den: denom };
    }

    // Check for whole number (integer)
    const wholeMatch = str.match(/^(-?\d+)$/);
    if (wholeMatch) {
      return { num: BigInt(wholeMatch[1]), den: 1n };
    }

    // Do not accept decimals - return null for non-fraction input
    return null;
  }

  function isFractionFormat(str) {
    // Check if input is in a valid fraction format (fraction, mixed number, or whole number)
    str = str.trim();
    const mixedMatch = str.match(/^(-?\d+)\s+(\d+)\/(\d+)$/);
    const fractionMatch = str.match(/^(-?\d+)\/(\d+)$/);
    const wholeMatch = str.match(/^(-?\d+)$/);
    return mixedMatch !== null || fractionMatch !== null || wholeMatch !== null;
  }

  function checkAnswer(userAnswer, correctAnswer, alternateAnswers){
    // First check alternate answers (exact string matches)
    if (alternateAnswers && alternateAnswers.length > 0) {
      const normalizedUser = userAnswer.trim().toLowerCase();
      for (let alt of alternateAnswers) {
        if (normalizedUser === alt.toLowerCase()) {
          return true;
        }
      }
    }

    // Validate fraction format - reject decimals
    if (!isFractionFormat(userAnswer)) {
      return false;
    }

    // Parse user answer
    const parsed = parseFraction(userAnswer);
    if(parsed === null) return false;

    // The exact correct value is the first alternate answer written as a fraction;
    // correctAnswer is a rounded decimal and must not be used for comparison.
    const exact = (alternateAnswers || []).map(parseFraction).find(f => f !== null);
    if(!exact) return false;

    // Exact comparison by cross-multiplication: a/b === c/d  <=>  a*d === c*b
    return parsed.num * exact.den === exact.num * parsed.den;
  }

  function formatCorrectAnswer(p) {
    // Show the most readable form of the answer
    if (p.alternateAnswers && p.alternateAnswers.length > 0) {
      // Prefer fraction form if available
      return p.alternateAnswers[0];
    }
    return p.answer;
  }

  function submitPuzzle(p){
    const answerInput = document.getElementById('answer-input');
    const userAnswer = answerInput.value.trim();

    const isCorrect = checkAnswer(userAnswer, p.answer, p.alternateAnswers);
    puzzleSolvedCorrectly = isCorrect;
    userSolved = isCorrect;
    if(!puzzleCompletionTime){ puzzleCompletionTime = Date.now() - puzzleStartTime; }

    if(isCorrect){
      answerInput.classList.add('correct');
      document.getElementById('feedback').innerHTML='<span style="color:green;font-weight:bold;">Correct!</span>';
    } else {
      answerInput.classList.add('incorrect');
      let feedbackHTML = '';
      if (p.solutionHint) {
        feedbackHTML += '<br><span style="color:#666;font-size:14px;">Solution: ' + p.solutionHint + '</span>';
      };
      document.getElementById('feedback').innerHTML = feedbackHTML;
      // Typeset MathJax in feedback
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([document.getElementById('feedback')]).catch((err) => console.log('MathJax typeset error:', err));
      }
    }
    // Disable answer input to prevent editing after submission
    answerInput.disabled = true;
    // Turn Submit button into Continue
    convertGiveUpToContinue();
  }

  function onGiveUp(p){
    const answerInput = document.getElementById('answer-input');
    const userAnswer = answerInput.value.trim();
    const isPretest = p.type === 'pretest';

    // If user hasn't entered anything
    if (userAnswer === '') {
      puzzleSolvedCorrectly = false;
      userSolved = false;
      if(!puzzleCompletionTime){ puzzleCompletionTime = Date.now() - puzzleStartTime; }
      puzzleGaveUp = true;

      // For pretest: show solution and require Continue button
      // For main experiment: proceed directly to next question
      if (isPretest) {
        let feedbackHTML = '<span style="color:#666;font-size:14px;">Solution: ' + p.solutionHint + '</span>';
        document.getElementById('feedback').innerHTML = feedbackHTML;
        // Typeset MathJax in feedback
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise([document.getElementById('feedback')]).catch((err) => console.log('MathJax typeset error:', err));
        }
        // Disable answer input to prevent editing after giving up
        answerInput.disabled = true;
        // Turn Skip button into Continue
        convertGiveUpToContinue();
      } else {
        // Proceed directly to next question without showing answer
        proceedToNextTrial();
      }
      return;
    }

    const isCorrect = checkAnswer(userAnswer, p.answer, p.alternateAnswers);
    puzzleSolvedCorrectly = isCorrect;
    userSolved = isCorrect;
    if(!puzzleCompletionTime){ puzzleCompletionTime = Date.now() - puzzleStartTime; }
    // Mark gave up only if not solved correctly
    puzzleGaveUp = !isCorrect;

    if(isCorrect){
      answerInput.classList.add('correct');
      document.getElementById('feedback').innerHTML='<span style="color:green;font-weight:bold;">Correct!</span>';
    } else {
      answerInput.classList.add('incorrect');
      let feedbackHTML = '';
      if (p.solutionHint) {
        feedbackHTML += '<br><span style="color:#666;font-size:14px;">Solution: ' + p.solutionHint + '</span>';
      };
      document.getElementById('feedback').innerHTML = feedbackHTML;
      // Typeset MathJax in feedback
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise([document.getElementById('feedback')]).catch((err) => console.log('MathJax typeset error:', err));
      }
    }
    // Disable answer input to prevent editing after giving up
    answerInput.disabled = true;
    // Turn Give Up button into Continue
    convertGiveUpToContinue();
  }

  function finalizePuzzleData(data, p){
    data.user_solved = userSolved;
    data.completion_time_ms = puzzleCompletionTime || (Date.now() - puzzleStartTime);
    data.user_gave_up = puzzleGaveUp;
    data.user_solved_correctly = puzzleSolvedCorrectly;
    // Get user's answer
    const answerInput = document.getElementById('answer-input');
    data.user_answer = answerInput ? answerInput.value.trim() : '';
    data.correct_answer = p.answer;
    data.alternate_answers = p.alternateAnswers || [];
    // Get chat logs specific to this puzzle
    data.chat_logs = allPuzzleChatLogs[p.id] || [];
    // write this trial to Firebase right away
    trialCounter += 1;
    const _key = String(trialCounter).padStart(2, "0") + "_" + p.id;
    writeRealtimeDatabase(basePath + "/trials/" + _key, {
      puzzle_id: p.id,
      puzzle_type: p.type,
      block: p.block || null,
      order: trialCounter,
      condition: CONDITION_LABEL,
      block_position: blockPosition,
      ai_available: currentAIAvailable,
      ai_notice_shown: currentNoticeShown,
      user_answer: data.user_answer || "",
      correct_answer: String(p.answer),
      solved: !!data.user_solved_correctly,
      gave_up: !!data.user_gave_up,
      skipped: !!data.user_gave_up && !data.user_answer,
      completion_time_ms: data.completion_time_ms,
      n_chat_messages: (allPuzzleChatLogs[p.id] || []).length,
      times_left_window: awayFor(p.id).count,
      fullscreen_exits: fsExits[p.id] || 0,
      fullscreen_out_ms: fsOutFor(p.id),
      time_away_ms: awayFor(p.id).ms,
      started_at: new Date(puzzleStartTime).toISOString(),
      timestamp: new Date().toISOString()
    });
  }

  /* ---------- GENERATE PUZZLE TRIALS ---------- */
  // Separate puzzles into groups by type and block
  const initialPuzzlesPool = puzzles.filter(p => p.type === 'initial');
  const finalPuzzlesPool = puzzles.filter(p => p.type === 'final');

  // Helper function to shuffle an array (Fisher-Yates)
  function shuffleArray(array) {
    const shuffled = array.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    return shuffled;
  }

  // Shuffle the 7 easy, 7 medium and 7 hard problems separately, then build 7 triplets of (easy, medium, hard).
  // Difficulty order inside every triplet is fixed; which problem lands in which triplet is random per participant.
  const easyPool = shuffleArray(initialPuzzlesPool.filter(p => p.block === 1));
  const mediumPool = shuffleArray(initialPuzzlesPool.filter(p => p.block === 2));
  const hardPool = shuffleArray(initialPuzzlesPool.filter(p => p.block === 3));
  const mainPuzzles = [];
  for (let t = 0; t < N_TRIPLETS; t++) { mainPuzzles.push(easyPool[t], mediumPool[t], hardPool[t]); }

  // Final puzzles in fixed order (no randomization)
  const finalPuzzles = finalPuzzlesPool.slice();

  const totalMainPuzzles = mainPuzzles.length + finalPuzzles.length;
  const totalPretestPuzzles = pretestPuzzles.length;

  /* ---------- FIRST INSTRUCTION SCREEN (with practice round message) ---------- */
  timeline.push({
    type: jsPsychInstructions,
    pages:[
      `<div style="width:1000px; text-align:left;"><h2>Learning Study</h2>
        <p>Welcome! Thank you for participating in this study about how different learning interventions can improve learning outcomes.</p>
        <p>In this study, you will be solving fractions problems. These include both direct calculations and word problems involving fractions.</p>
        <p>Enter answers as fractions (e.g., 3/4) or mixed numbers (e.g., 2 1/2).</p>
        <p><b>Let's do a practice round so that you can get familiar with the interface.</b></p>
        <p>Please press next to continue.</p>
      </div>`
    ],
    show_clickable_nav:true
  });

  /* ---------- PRE-TEST PUZZLES (practice round, no chat/hints) ---------- */
  pretestPuzzles.forEach((p, index)=>{
    timeline.push({
      type: jsPsychSurveyHtmlForm,
      html: ()=>buildPuzzleHTML(p, index, totalPretestPuzzles),
      button_label:'Continue',
      data:{ stimulus_type:'fractions_puzzle', puzzle_id:p.id, puzzle_type:p.type, puzzle_index: index + 1, is_pretest: true },
      on_load: ()=>setupPuzzle(p, false), // No chat for pretest
      on_finish: d=>finalizePuzzleData(d,p)
    });
  });

  /* ---------- INSTRUCTION SCREEN ---------- */
  // Control keeps its own text (work alone, no AI). AI, AI_block and AI_interleaved all see the same text.
  if (participantNoAI) {
    timeline.push({
      type: jsPsychInstructions,
      pages:[
        `<div style="width:1000px; text-align:left;">
          <p>In this study, we want you to work through the fraction problems on your own, without an AI assistant. We highly encourage you to use paper and pen, and take your time to work through the solutions.</p>
          <p>Please don't use AI tools, Calculator, or Google to solve the problems.</p>
          <p><b>Important:</b> Your payment does NOT depend on how many problems you answer correctly.</p>
          <p>Please press next to continue.</p>
        </div>`
      ],
      show_clickable_nav:true
    });
  } else {
    timeline.push({
      type: jsPsychInstructions,
      pages:[
        `<div style="width:1000px; text-align:left;">
          <p>On some problems you will have access to an AI assistant (ChatGPT) to help you solve them. When it is available, the chat will appear on the right side of the screen, and you can use it however you like -- feel free to ask it for hints, answers, or solutions.</p>
          <p>On the other problems, ChatGPT will not be available, and the right side of the screen will say so. We highly encourage you to use paper and pen, and take your time to work through the solutions. When ChatGPT isn't available, please don't use other AI tools, Calculator, or Google.</p>
          <p><b>Important:</b> Your payment does NOT depend on how many problems you answer correctly.</p>
          <p>Please press next to continue.</p>
        </div>`
      ],
      show_clickable_nav:true
    });
  }

  // Add main puzzles (AI chat or the "not available" notice, per condition schedule)
  mainPuzzles.forEach((p, index)=>{
    const puzzleIndex = index; // 0-based index for progress bar
    timeline.push({
      type: jsPsychSurveyHtmlForm,
      html: ()=>buildPuzzleHTML(p, puzzleIndex, totalMainPuzzles),
      button_label:'Continue',
      data:{ stimulus_type:'fractions_puzzle', puzzle_id:p.id, puzzle_type:p.type, puzzle_block: p.block, puzzle_index: index + 1 },
      on_load: ()=>setupPuzzle(p, true, aiAvailableOnTraining(puzzleIndex)), // training: chat where the schedule says AI is on, otherwise the notice
      on_finish: d=>finalizePuzzleData(d,p)
    });
  });


  /* ---------- FINAL PUZZLES WITHOUT AI ASSISTANT ---------- */
  // Add final puzzles (no AI assistant for anyone)
  finalPuzzles.forEach((fp, index) => {
    const puzzleIndex = mainPuzzles.length + index; // Continue from where initial puzzles ended
    timeline.push({
      type: jsPsychSurveyHtmlForm,
      html: ()=>buildPuzzleHTML(fp, puzzleIndex, totalMainPuzzles),
      button_label:'Continue',
      data:{ stimulus_type:'fractions_puzzle', puzzle_id:fp.id, puzzle_type:fp.type, no_ai_assistant: true, final_puzzle_index: index + 1 },
      on_load: ()=>setupPuzzle(fp, true, false), // final test: no AI for anyone, the sidebar says so
      on_finish: d=>finalizePuzzleData(d,fp)
    });
  });

  /* ---------- POST-SURVEY (attention check only) ---------- */
  timeline.push({
    type: jsPsychSurveyLikert,
    preamble: '<div style="width:1000px;"><p>Please answer the following question.</p></div>',
    questions: [
      { prompt: 'This is a quick attention check, please select the option paying attention (10)', name: 'Attention', labels: ['1 (not paying attention)', '','','','','','','','', '10 (paying attention)'], required: true }
    ],
    data: { stimulus_type: 'post_survey' }
  });

  // AI usage survey (only for AI condition) - multiple choice
  var aiUsageSurvey = {
    type: jsPsychSurveyMultiChoice,
    questions: [
      {
        prompt: "How did you primarily use the AI assistant (ChatGPT) while solving the problems?",
        name: 'AI_Usage_Type',
        options: [
          'To get the solution directly',
          'To get hints about how to approach the problem',
          'To clarify or understand the question better',
          'To get examples of similar problems',
          'I did not use the AI assistant',
          'Other'
        ],
        required: true
      }
    ],
    randomize_question_order: false,
    data: { stimulus_type: 'ai_usage_survey' }
  };

  // Only add AI usage survey for AI condition
  if (!participantNoAI) {
    timeline.push(aiUsageSurvey);
  }

  /* ---------- BOT CHECK ---------- */
  timeline.push({
    type: jsPsychSurveyHtmlForm,
    html: `<div style="text-align:center; padding:20px; max-width:600px; margin:0 auto;">
      <h2 style="margin-bottom:8px;">Quick Check</h2>
      <p style="font-size:17px; color:#444;">Please answer the question below before continuing.</p>
      <img src="hand-AI-catch.png" alt="A hand" style="max-width:280px; margin:20px auto; display:block;">
      <p style="font-size:20px; font-weight:bold; margin-bottom:16px;">How many fingers are on the hand?</p>
      <input type="number" name="bot_check_answer" id="bot-check-input"
             min="1" max="20" required
             style="width:100px; height:44px; font-size:22px; text-align:center; border:2px solid #333; border-radius:4px;"
             placeholder="?">
    </div>`,
    button_label: 'Submit',
    data: { stimulus_type: 'bot_check' },
    on_finish: function(data) {
      var raw = data.response ? data.response.bot_check_answer : null;
      data.bot_check_response = raw !== null && raw !== '' ? parseInt(raw) : null;
      data.bot_check_correct = data.bot_check_response === 6;
    }
  });

  /* ---------- OPEN-ENDED FEEDBACK (optional, last screen) ---------- */
  timeline.push({
    type: jsPsychSurveyHtmlForm,
    html: `<div style="width:700px; max-width:90vw; margin:0 auto; text-align:left;">
      <h2 style="margin-bottom:8px;">Your feedback</h2>
      <p style="font-size:17px; color:#444;">We would love your feedback on this experiment. Was anything confusing, frustrating, or worth mentioning? This question is optional.</p>
      <textarea name="feedback" rows="7" maxlength="3000"
        style="width:100%; box-sizing:border-box; font-size:17px; padding:10px; border:2px solid #999; border-radius:4px; font-family:inherit;"
        placeholder="Type your comments here (optional)"></textarea>
    </div>`,
    button_label: 'Finish',
    data: { stimulus_type: 'feedback' }
  });

  jsPsych.run(timeline);
</script>
